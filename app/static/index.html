<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora Policy Chat</title>
<style>
:root{--ink:#182230;--muted:#627187;--line:#dfe6ee;--blue:#2457d6;--pale:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#15243a;color:white;padding:20px 24px}header>div,main{width:min(900px,calc(100% - 32px));margin:auto}.brand{font-size:13px;opacity:.78;text-transform:uppercase;letter-spacing:.06em}h1{margin:4px 0;font-size:clamp(23px,4vw,30px)}main{padding:24px 0 48px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}.toolbar button,.suggestions button{background:white;color:#31415a;border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}.chat{background:#fff;border:1px solid var(--line);border-radius:15px;min-height:340px;max-height:58vh;overflow:auto;padding:18px}.message{max-width:88%;margin:8px 0 16px;padding:13px 15px;border-radius:13px;white-space:pre-wrap}.assistant{background:var(--pale);border:1px solid var(--line)}.user{background:#e8efff;margin-left:auto}.speaker{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.answer{white-space:pre-wrap}.badge{display:inline-block;margin-top:9px;background:#e7edff;color:#2449a9;border-radius:99px;padding:3px 9px;font-size:12px}.source{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:13px}.source small{display:block;color:var(--muted)}form,.feedback{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px}textarea{font:inherit;width:100%;resize:vertical;min-height:76px;border:1px solid #bbc7d5;border-radius:9px;padding:11px}textarea:focus{outline:3px solid #2457d633;border-color:var(--blue)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}button.primary{border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:650;padding:10px 15px;cursor:pointer}button:disabled{opacity:.6}.status{color:var(--muted);font-size:13px}.error{color:#a32929}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.suggestions button{font-size:13px}.feedback{display:none}.feedback select{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}@media(max-width:560px){.chat{padding:12px}.message{max-width:96%}}
</style></head>
<body>
<header><div><div class="brand">Nexora · Knowledge Intelligence</div><h1>Policy Assistant</h1></div></header>
<main>
  <div class="toolbar"><span>Ask questions and follow up in the same conversation.</span><button id="clear-chat" type="button">New chat</button></div>
  <section id="chat" class="chat" aria-live="polite"><div class="message assistant"><div class="speaker">Policy assistant</div><div class="answer">Hello! Ask me about the company policies. I’ll answer using retrieved passages and show the sources.</div></div></section>
  <form id="chat-form"><label for="question"><strong>Your message</strong></label><textarea id="question" maxlength="2000" required placeholder="How many annual leave days are available?"></textarea><div class="actions"><button id="send" class="primary" type="submit">Send</button><span id="status" class="status" role="status"></span></div></form>
  <div class="suggestions"><button type="button" data-q="How many annual leave days are available?">Annual leave</button><button type="button" data-q="What does the policy say about parental leave?">Parental leave</button><button type="button" data-q="How should employees report a security incident?">Security incident</button></div>
  <section id="feedback" class="feedback"><strong>Rate the last answer</strong><div class="actions"><select id="rating"><option value="5">5 — Helpful</option><option value="4">4</option><option value="3">3 — Partly</option><option value="2">2</option><option value="1">1 — Not helpful</option></select><button id="send-feedback" type="button">Send feedback</button><span id="feedback-status" class="status" role="status"></span></div><label for="correction">Optional correction</label><textarea id="correction" maxlength="500" placeholder="What should be corrected? Avoid sensitive information."></textarea></section>
</main>
<script>
const chat=document.getElementById('chat'), form=document.getElementById('chat-form'), input=document.getElementById('question'), send=document.getElementById('send'), status=document.getElementById('status');
let history=[],latestRequestId=null;
function addMessage(role,text,data=null){const box=document.createElement('div');box.className=`message ${role}`;const who=document.createElement('div');who.className='speaker';who.textContent=role==='user'?'You':'Policy assistant';const body=document.createElement('div');body.className='answer';body.textContent=text;box.append(who,body);if(data){const badge=document.createElement('span');badge.className='badge';badge.textContent=`Model: ${data.model}`;box.append(badge);for(const c of data.citations||[]){const src=document.createElement('div');src.className='source';const title=document.createElement('strong');title.textContent=`[${c.citation_id}] ${c.title}`;const detail=document.createElement('small');const pages=c.page_start?` · pages ${c.page_start}${c.page_end&&c.page_end!==c.page_start?`–${c.page_end}`:''}`:'';detail.textContent=`${c.section}${pages}`;src.append(title,detail);box.append(src)}}chat.append(box);chat.scrollTop=chat.scrollHeight}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;input.focus()});
form.addEventListener('submit',async e=>{e.preventDefault();const question=input.value.trim();if(!question)return;const prior=history.slice(-8);history.push({role:'user',content:question});addMessage('user',question);input.value='';send.disabled=true;status.textContent='Searching policy documents…';status.className='status';try{const r=await fetch('/v1/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,history:prior})});const data=await r.json();if(!r.ok)throw Error(data.detail||'The request failed.');latestRequestId=data.request_id;history.push({role:'assistant',content:data.answer});addMessage('assistant',data.answer,data);document.getElementById('feedback').style.display='block';document.getElementById('feedback-status').textContent='';status.textContent=data.citation_validation?'Citations checked.':'Citation review is needed.';document.getElementById('feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(err){status.textContent=err.message;status.className='status error'}finally{send.disabled=false;input.focus()}});
document.getElementById('clear-chat').onclick=()=>{history=[];latestRequestId=null;chat.replaceChildren();addMessage('assistant','New chat started. Ask a question about the company policies.');document.getElementById('feedback').style.display='none';status.textContent='';input.focus()};
document.getElementById('send-feedback').onclick=async()=>{const out=document.getElementById('feedback-status');if(!latestRequestId){out.textContent='Ask a question first.';return}try{const r=await fetch('/v1/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:latestRequestId,rating:Number(document.getElementById('rating').value),correction:document.getElementById('correction').value.trim()||null})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Feedback was not saved.');out.textContent=data.accepted?'Feedback saved locally.':'Feedback was not saved.'}catch(err){out.textContent=err.message;out.className='status error'}};
</script></body></html>
